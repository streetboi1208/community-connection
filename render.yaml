# Optional: one-click pilot hosting on Render (render.com) as a "Blueprint".
# Creates the web app and a PostgreSQL database. Loads sample events and demo accounts on first start,
# then CNB's real Galaxy volunteer history (names, branch, hours; no contact details) from data/galaxy (Eddie, Nov 16 2026).
# For production, host under a bank-owned account approved by Information Security.
services:
  - type: web
    name: community-connection-pilot
    runtime: node
    plan: free        # $0; sleeps after 15 min idle. Change to starter for an always-on app.
    buildCommand: npm ci --omit=dev
    startCommand: node db/seed.js && node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TZ
        value: America/Chicago
      - key: DATABASE_URL
        fromDatabase:
          name: community-connection-db
          property: connectionString
      - key: DEMO_PASSWORD
        sync: false   # you type this in the Render dashboard; it becomes the password for the demo.* accounts
databases:
  - name: community-connection-db
    plan: free        # $0; Render deletes free databases after 30 days (+14-day grace). Upgrade to keep data.
