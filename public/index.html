<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Community Connection</title>
<meta name="theme-color" content="#26337a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CNB Connect">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/pilot.css">
</head>
<body>
<div class="stage web">
  <div class="app" id="app">
    <header class="top" id="top" hidden>
      <a class="logobtn" href="#/" title="Home"><img src="/img/logo-white.png" alt="Community National Bank, go to Home"></a>
      <span class="appname">Community Connection</span>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <button class="modebtn" id="modeBtn" hidden></button>
      <a class="avatar avbtn" id="avBtn" href="#/profile" title="Your profile"></a>
    </header>
    <main id="main"><p class="muted">Loading…</p></main>
    <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
</div>
<script src="/icons.js"></script>
<script src="/track.js"></script>
<script src="/app.js"></script>
</body>
</html>
